<script>
// Sitenin kok adresi. Wix'te site adresi degisirse yalnizca burasi guncellenir.
// Adres yanlissa sayfa kodu adresi site koküyle eslestiremiyor ve derin
// baglantinin sorgu dizesini dusuruyor: kart urune degil sade siparis
// sayfasina gidiyor.
const SITE_BASE = 'https://nepagy.wixstudio.com/dr-grill';

// NOT: Bu yollar Kuzela'nin coklanan sitesinden kopyalandi (/bestel-nu,
// /over-ons, /contact). DR Grill sitesinde sayfa adlari farkliysa guncelle.
const ORDER_URL = `${SITE_BASE}/bestel-nu`;
const ABOUT_URL = `${SITE_BASE}/over-ons`;
const CONTACT_URL = `${SITE_BASE}/contact`;

/*
 * Urun kartlari, Kuzela'daki gibi Wix Restaurants menusunden gelecek
 * (Home.c1dmp.js menuyu okuyup buraya postMessage ile gonderiyor).
 * Asagidaki liste PLACEHOLDER: gercek menu Wix Restaurants panelinde
 * kurulana kadar gosterilen yedek. Isimler/fiyatlar tahminidir, gercek
 * menu panelinden guncellenmeli. Fotograf yerine marka renkleriyle
 * uretilen basit rozet kullanildi (gercek urun fotografi yok).
 */
function placeholderPhoto(label) {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'>`
    + `<rect width='400' height='300' fill='#242020'/>`
    + `<rect width='400' height='10' fill='#d62828'/>`
    + `<text x='50%' y='56%' font-family='Arial, Helvetica, sans-serif' font-size='34' font-weight='800' fill='#fffdfb' text-anchor='middle'>${label}</text>`
    + `</svg>`;
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

const FALLBACK_PRODUCTS = [
  { name: 'Kebabschotel', note: 'Mager rundvlees, verse groenten, huissaus', price: '€12.50', image: placeholderPhoto('KEBAB') },
  { name: 'Mixed Grill Bord', note: 'Kipfilet, lamskotelet, chipolata & frietjes', price: '€16.00', image: placeholderPhoto('GRILL') },
  { name: 'Pizza Margherita', note: 'Tomaat, mozzarella, vers basilicum', price: '€11.00', image: placeholderPhoto('PIZZA') },
  { name: 'Pizza Pepperoni', note: 'Pittige pepperoni, mozzarella, tomaat', price: '€12.50', image: placeholderPhoto('PIZZA') },
  { name: 'Pasta Bolognese', note: 'Huisgemaakte tomaat-gehaktsaus, parmezaan', price: '€10.50', image: placeholderPhoto('PASTA') },
  { name: 'Durum Kip Spicy', note: 'Kip spicy, verse groenten, saus naar keuze', price: '€8.50', image: placeholderPhoto('WRAP') }
];

// Isimler ve aciklamalar menu panelinden geliyor, yani HTML'e gomulmeden
// once kacislanmasi gerekiyor.
const escapeHtml = (value) => String(value == null ? '' : value)
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

// Siparis sayfasi urunu lightbox'ta aciyor; bunun icin uc kimlik gerekiyor.
// Kimlikler yoksa (yedek liste) genel siparis sayfasina dusuyoruz.
function itemUrl(item) {
  if (!item.id || !item.sectionId || !item.menuId) return ORDER_URL;
  const q = 'lightboxOnScreen=true'
    + '&itemId=' + encodeURIComponent(item.id)
    + '&sectionId=' + encodeURIComponent(item.sectionId)
    + '&menuId=' + encodeURIComponent(item.menuId);
  return ORDER_URL + '?' + q;
}

function cardsHtml(list, revealed) {
  return list.map((item, index) => {
    const name = escapeHtml(item.name);
    const href = escapeHtml(itemUrl(item));
    const alt = escapeHtml(item.alt || `${item.name} bij DR Grill`);
    return `
  <article class="product reveal${revealed ? ' visible' : ''}" style="--delay:${index * 70}ms">
    <a href="${href}" data-page="order" target="_top" aria-label="Bestel ${name}">
      <div class="photo">
        <img src="${escapeHtml(item.image)}" alt="${alt}" loading="lazy">
        <span>${String(index + 1).padStart(2, '0')}</span>
      </div>
      <div class="product-copy"><div><h3>${name}</h3><p>${escapeHtml(item.note)}</p></div><strong>${escapeHtml(item.price)}</strong></div>
    </a>
  </article>`;
  }).join('');
}

        .closing{padding:clamp(80px,9vw,140px) 24px;text-align:center;background:var(--red);color:var(--ink)}.closing h2{max-width:1200px;margin:0 auto 42px;font-size:clamp(56px,9vw,140px);font-weight:900;letter-spacing:-.085em;line-height:.82}.closing .pill{min-height:58px;padding-inline:34px}
        .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease var(--delay,0ms),transform .8s cubic-bezier(.22,1,.36,1) var(--delay,0ms)}.reveal.visible{opacity:1;transform:none}

        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
      </style>
      <main class="site">

        <section class="intro wrap" id="over"><div><p class="eyebrow">DR GRILL · DESSEL</p><h2>Meer dan een frituur alleen.</h2></div><div class="intro-copy reveal"><p>Verse kebab van het spit, krokante pizza's uit de oven en huisbereide pasta — alles net klaar wanneer jij bestelt. Voor thuis, onderweg of om ter plekke te proeven.</p><a class="pill dark" href="${ORDER_URL}" data-page="order" target="_top">Wat wordt het vandaag?</a></div></section>

      </main>`;

    /* ---------- reveal animasyonu ---------- */
    const observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    }), { threshold: 0.12 });
    root.querySelectorAll('.reveal').forEach((element) => observer.observe(element));

    /* ---------- iframe yuksekligini Wix'e bildir ---------- */
    const host = this;
    let lastHeight = 0;
    let queueTimer = null;
    // Kartlar menuden mi geldi yoksa yedek listeden mi? Yukseklik mesajiyla
    // birlikte bildiriliyor, boylece disaridan dogrulanabiliyor.
    let productSource = 'fallback';

    // NOT: documentElement/body scrollHeight kullanilmiyor. Onlar iframe'in mevcut
    // yuksekligi kadar buyuk kaliyor ve yukseklik bir daha asla kuculmuyor.
    // Sadece bilesenin gercek yuksekligini olcuyoruz -> hem buyuyup hem kuculebiliyor.
    const measure = () => {
      const height = host.getBoundingClientRect().height;
      return Math.ceil(height || Math.max(document.documentElement.scrollHeight, document.body.scrollHeight));
    };

    const sendHeight = (force) => {
      const height = measure();
      if (!height) return;
      if (!force && Math.abs(height - lastHeight) < 2) return;
      lastHeight = height;
      window.parent.postMessage({ type: 'drgrillHomeHeight', height, productSource }, '*');
    };

    // requestAnimationFrame kullanmiyoruz: sekme arka plana dusunce callback hic
    // calismayip kilit takili kalabiliyor ve yukseklik guncellemeleri tamamen duruyor.
    const queueSend = () => {
      if (queueTimer) clearTimeout(queueTimer);
      queueTimer = setTimeout(() => { queueTimer = null; sendHeight(false); }, 60);
    };

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(queueSend);
      ro.observe(host);
      ro.observe(document.body);
    }
    root.querySelectorAll('img').forEach((img) => {
      img.addEventListener('load', queueSend);
      img.addEventListener('error', queueSend);
    });
    window.addEventListener('resize', queueSend);
    window.addEventListener('load', () => sendHeight(true));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => sendHeight(true));

    // Wix ilk mesajlari bazen kaciriyor: ilk 6 saniye boyunca tekrar gonder
    [0, 120, 350, 700, 1200, 2000, 3000, 4500, 6000].forEach((ms) => setTimeout(() => sendHeight(true), ms));

    // Emniyet agi: gozlemcilerden biri kacirirsa saniyede bir kontrol et.
    // Yukseklik degismediyse mesaj gonderilmiyor, maliyeti yok denecek kadar az.
    setInterval(() => sendHeight(false), 1000);

    /* ---------- menuden gelen urun verisi ---------- */
    const grid = root.querySelector('.grid');

    // Sayfa kodu urun listesini her mesajda tekrar gonderiyor ve gomulu sayfa
    // saniyede bir yukseklik mesaji attigi icin bu saniyede bir tekrarlaniyordu.
    // Her seferinde grid.innerHTML yeniden yazilinca kartlar silinip yeniden
    // yaratiliyor, gercek fare tiklamasi da mousedown ile mouseup arasinda
    // karti kaybedip hic olusmuyordu (programli .click() ve sag tik calisiyordu).
    // Ayni veri geldiginde artik hicbir sey yapmiyoruz.
    let productsSignature = '';

    const applyProducts = (list) => {
      if (!grid || !Array.isArray(list) || !list.length) return;

      const signature = list.map((item) => [item.id, item.name, item.price, item.image].join('~')).join('|');
      if (signature === productsSignature) return;
      productsSignature = signature;
      // Kartlar zaten gorunur olarak ciziliyor: veri sonradan geldigi icin
      // reveal animasyonunu bastan oynatmak yerine dogrudan yerine koyuyoruz.
      grid.innerHTML = cardsHtml(list.slice(0, 8), true);
      productSource = 'menu';
      bindLinks(); // yeni kartlarin baglantilarina dinleyici bagla
      grid.querySelectorAll('img').forEach((img) => {
        img.addEventListener('load', queueSend);
        img.addEventListener('error', queueSend);
      });
      sendHeight(true);
    };

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'drgrillAskHeight') sendHeight(true);
      if (data.type === 'drgrillProducts') applyProducts(data.items);
    });

    // Sayfa kodu, iframe hazir olmadan urunleri gondermis olabilir.
    // "Hazirim" diyerek verinin bize itilmesini istiyoruz.
    const announceReady = () => window.parent.postMessage({ type: 'drgrillReady' }, '*');
    [0, 300, 1000, 2500].forEach((ms) => setTimeout(announceReady, ms));

    /* ---------- dis baglantilar ---------- */
    // Kartlar ve butonlar target="_top" ile calisiyordu, ama Wix'in gomulu
    // iframe'i sandbox'li: ust pencereye gitmeye izin verilmiyor ve tiklayinca
    // hicbir sey olmuyordu. Gezinmeyi sayfa koduna devrediyoruz.
    // Sayfa tek basina acildiginda (GitHub Pages) normal gezinme calisiyor.
    const followLink = (event, link) => {
      const href = link && link.getAttribute('href');
      if (!href || href.charAt(0) === '#') return; // sayfa ici baglantilar asagida
      // Hem dogrudan hem delege dinleyici var; ayni tiklama iki kez
      // islenmesin diye olayi isaretliyoruz.
      if (event.__drgHandled) return;
      event.__drgHandled = true;

      // preventDefault ETMIYORUZ. Onceden ediyorduk ve tarayicinin kendi
      // target="_top" gezinmesini iptal edip yerine sayfa koduna guveniyorduk;
      // o yol takilinca tiklama tamamen olu kaliyordu (sag tik > yeni sekmede
      // ac calisiyordu, sol tik calismiyordu - engelleyen bizdik).
      // Simdi iki yol da acik: tarayici gidebiliyorsa gider, sandbox
      // engellerse asagidaki mesajla sayfa kodu goturur.
      window.parent.postMessage({ type: 'drgrillNavigate', url: href, page: link.getAttribute('data-page') || '' }, '*');
    };

    // Once dogrudan dinleyici: her baglantiya tek tek baglaniyor. Kartlar
    // menu verisi gelince yeniden ciziliyor, o yuzden bindLinks tekrar cagriliyor.
    const bindLinks = () => {
      root.querySelectorAll('a[href]').forEach((link) => {
        if (link.__drgBound) return;
        link.__drgBound = true;
        link.addEventListener('click', (event) => followLink(event, link));
      });
    };
    bindLinks();

    // Yedek olarak delegasyon da duruyor (dogrudan dinleyici kacirirsa).
    root.addEventListener('click', (event) => {
      const path = typeof event.composedPath === 'function' ? event.composedPath() : [];
      const link = path.find((node) => node && node.tagName === 'A' && node.getAttribute('href'));
      if (link) followLink(event, link);
    });

    /* ---------- sayfa ici linkler (shadow DOM icinde otomatik calismaz) ---------- */
    root.querySelectorAll('a[href^="#"]').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        const target = root.getElementById(link.getAttribute('href').slice(1));
        if (!target) return;
        const top = Math.max(0, Math.round(target.getBoundingClientRect().top + window.scrollY));
        // Wix sayfasinin kaymasi icin (Velo kodu varsa calisir)
        window.parent.postMessage({ type: 'drgrillScrollTo', top }, '*');
        // Velo yoksa iframe kendi icinde kaydirmayi dener
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }
}

if (!customElements.get('drgrill-home')) customElements.define('drgrill-home', DrGrillHome);
</script>
